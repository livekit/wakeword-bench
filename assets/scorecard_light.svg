<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" font-family="&#x27;Public Sans&#x27;, ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><rect width="880" height="274" rx="8" fill="#fdfdfc"/><text x="20" y="34" fill="#3b3b3b" font-size="14" font-weight="600">livekit:hey_livekit</text><text x="860" y="34" fill="#636363" font-size="12" text-anchor="end">3,000 wake words · 4,873 negatives · held-out voices &amp; rooms</text><rect x="20.0" y="50" width="272.0" height="96" rx="6" fill="#efefec" stroke="#dbdbd8"/><text x="36.0" y="74" fill="#636363" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="11" letter-spacing="0.6">SCORE</text><text x="36.0" y="110" fill="#002cf2" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="30" font-weight="500">44.5%</text><text x="36.0" y="132" fill="#707070" font-size="11.5">recall at ≤ 0.5 false alarms / h</text><rect x="304.0" y="50" width="272.0" height="96" rx="6" fill="#efefec" stroke="#dbdbd8"/><text x="320.0" y="74" fill="#636363" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="11" letter-spacing="0.6">RECALL</text><text x="320.0" y="110" fill="#000000" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="30" font-weight="500">76.0%</text><text x="320.0" y="132" fill="#707070" font-size="11.5">at threshold 0.5</text><rect x="588.0" y="50" width="272.0" height="96" rx="6" fill="#efefec" stroke="#dbdbd8"/><text x="604.0" y="74" fill="#636363" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="11" letter-spacing="0.6">FALSE ALARMS / H</text><text x="604.0" y="110" fill="#000000" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="30" font-weight="500">28.9</text><text x="604.0" y="132" fill="#707070" font-size="11.5">at threshold 0.5, 6.1 h of audio</text><rect x="20.0" y="158" width="272.0" height="96" rx="6" fill="#efefec" stroke="#dbdbd8"/><text x="36.0" y="182" fill="#636363" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="11" letter-spacing="0.6">CONFUSABLES ACCEPTED</text><text x="36.0" y="218" fill="#000000" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="30" font-weight="500">58.9%</text><text x="36.0" y="240" fill="#707070" font-size="11.5">of 3,000 near-miss phrases</text><rect x="304.0" y="158" width="272.0" height="96" rx="6" fill="#efefec" stroke="#dbdbd8"/><text x="320.0" y="182" fill="#636363" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="11" letter-spacing="0.6">LATENCY P50</text><text x="320.0" y="218" fill="#000000" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="30" font-weight="500">-64 ms</text><text x="320.0" y="240" fill="#707070" font-size="11.5">vs end of wake word</text><rect x="588.0" y="158" width="272.0" height="96" rx="6" fill="#efefec" stroke="#dbdbd8"/><text x="604.0" y="182" fill="#636363" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="11" letter-spacing="0.6">COMPUTE</text><text x="604.0" y="218" fill="#000000" font-family="CommitMono, ui-monospace, &#x27;SF Mono&#x27;, &#x27;Cascadia Mono&#x27;, Menlo, monospace" font-size="30" font-weight="500">0.21×</text><text x="604.0" y="240" fill="#707070" font-size="11.5">real-time factor (CPU)</text></svg>